    <script>
      ;(() => {
        const settingsEndpoint = 'http://localhost:11180/api/plugins/com.ckylab.first-comment-big-settings'
        const originalFetch = window.fetch.bind(window)
        const settingsVariables = new Set([
          '--panel-background',
          '--comment-text-color',
          '--comment-border-color',
          '--gift-neutral-background',
          '--gift-neutral-text-color',
          '--comment-font-size',
          '--first-comment-font-size',
        ])
        const originalSetProperty = CSSStyleDeclaration.prototype.setProperty
        window.__fixtureSettingsMetrics = {
          setPropertyCount: 0,
          setPropertyCounts: Object.fromEntries(Array.from(settingsVariables, (name) => [name, 0])),
        }
        CSSStyleDeclaration.prototype.setProperty = function setProperty(name, value, priority) {
          if (settingsVariables.has(name)) {
            window.__fixtureSettingsMetrics.setPropertyCount += 1
            window.__fixtureSettingsMetrics.setPropertyCounts[name] += 1
          }
          return originalSetProperty.call(this, name, value, priority)
        }

        window.__fixtureSettingsApi = {
          settings: { theme: 'light', commentFontSize: 32, firstCommentFontSize: 64 },
          fail: false,
          getCount: 0,
          stopCallCount: 0,
          throwAfterStop: false,
          set(next) {
            this.settings = structuredClone(next)
          },
        }
        window.fetch = (input, ...args) => {
          const url = input instanceof Request ? input.url : String(input)
          if (url !== settingsEndpoint) return originalFetch(input, ...args)
          window.__fixtureSettingsApi.getCount += 1
          if (window.__fixtureSettingsApi.fail) {
            return Promise.reject(new Error('fixture settings API failure'))
          }
          return Promise.resolve({
            ok: true,
            json: async () => ({
              code: 200,
              response: structuredClone(window.__fixtureSettingsApi.settings),
            }),
          })
        }

        const storageKey = 'onecomme.first-comment-big.anonymous-history.v1'
        localStorage.setItem(
          storageKey,
          JSON.stringify({
            version: 1,
            lives: [
              {
                service: 'twicas',
                liveId: 'fixture-live',
                names: ['匿名コメント#3000'],
              },
            ],
          }),
        )

        let callback = null
        window.__fixtureState = {
          action: null,
          connected: false,
          setup: null,
          subscriberId: null,
          emitCommentsCallCount: 0,
          unsubscribeCallCount: 0,
          unsubscribeThrowCount: 0,
          unsubscribedId: null,
          throwOnUnsubscribe: false,
        }
        window.OneSDK = {
          PERM: { COMMENT: 'comment' },
          ready: async () => {},
          usePermission: () => ['comments'],
          setup: async (options) => {
            window.__fixtureState.setup = options
            document.documentElement.dataset.setup = JSON.stringify(options)
          },
          subscribe: ({ action, callback: nextCallback }) => {
            callback = nextCallback
            window.__fixtureState.action = action
            window.__fixtureState.subscriberId = 'fixture-subscriber'
            document.documentElement.dataset.action = action
            document.documentElement.dataset.subscriberId = 'fixture-subscriber'
            return 'fixture-subscriber'
          },
          connect: async () => {
            window.__fixtureState.connected = true
            document.documentElement.dataset.connected = 'true'
          },
          unsubscribe: (id) => {
            window.__fixtureState.unsubscribeCallCount += 1
            window.__fixtureState.unsubscribedId = id
            document.documentElement.dataset.unsubscribedId = id
            callback = null
            if (window.__fixtureState.throwOnUnsubscribe) {
              window.__fixtureState.unsubscribeThrowCount += 1
              throw new Error('fixture OneSDK unsubscribe failure')
            }
          },
          emitComments: (comments) => {
            window.__fixtureState.emitCommentsCallCount += 1
            if (callback) callback(comments)
          },
        }
      })()
    </script>

    <script>
      ;(() => {
        const productionSettingsClient = window.FirstCommentBigSettingsClient
        window.FirstCommentBigSettingsClient = Object.freeze({
          ...productionSettingsClient,
          createSettingsClient(options) {
            const controller = productionSettingsClient.createSettingsClient(options)
            return Object.freeze({
              start: controller.start,
              stop() {
                window.__fixtureSettingsApi.stopCallCount += 1
                controller.stop()
                if (window.__fixtureSettingsApi.throwAfterStop) {
                  throw new Error('fixture settings stop failure')
                }
              },
            })
          },
        })
      })()
    </script>

        }))
        document.getElementById('emit-html-entities').addEventListener('click', () => emit(normal('見た(´&gt;ω&lt;｀)☆ &amp;gt; &#62; &#x3C;', false)))
        document.getElementById('emit-html-tags').addEventListener('click', () => emit(normal('&lt;script&gt;window.__fixtureExecuted=true&lt;/script&gt;&lt;img onerror="window.__fixtureExecuted=true"&gt;', false)))
        document.getElementById('emit-viewport-sequence').addEventListener('click', () => {
          const container = document.getElementById('comments')
          container.replaceChildren()

          const comments = Array.from({ length: 30 }, (_, index) => {
            const number = index + 1
            if (number === 28) {
              return normal(`表示領域${number} 長文${'折り返し確認'.repeat(8)}`, false)
            }
            return normal(`表示領域${number}${number === 29 ? ' BIG' : ''}`, number === 29)
          })
          window.OneSDK.emitComments(comments)

          const rendered = Array.from(container.querySelectorAll('.comment'))
          const numbers = rendered.map((element) => {
            const match = element.textContent.match(/^表示領域(\d+)/)
            return match ? Number(match[1]) : null
          })
          const newestFirst = numbers.every(
            (number, index) => number === 30 - index,
          )
          const fitsVertically =
            container.scrollHeight <= container.clientHeight ||
            container.childElementCount === 1

          document.documentElement.dataset.viewportFitPass = String(
            rendered.length > 1 &&
              rendered.length < comments.length &&
              newestFirst &&
              fitsVertically &&
              rendered.some((element) => element.classList.contains('comment--first')) &&
              rendered.some((element) => element.textContent.includes('長文')),
          )
        })

        const settingsChecks = [
          ['initial', 'light / 32 / 64'],
          ['dark', 'dark反映'],
          ['normal-size', '通常文字サイズ変更'],
          ['big-size', 'BIG文字サイズ変更'],
          ['same-settings', '同一設定で再適用なし'],
          ['size-refit', 'size変更後fit'],
          ['neutral-gift-theme', 'neutral giftテーマ追従'],
          ['twicas-gift-colors', 'TwitCasting gift色維持'],
          ['kick-gift-colors', 'Kick gift色維持'],
          ['normal-render', '通常コメント'],
          ['first-render', '初コメBIG'],
          ['kick-emote-render', 'Kickエモート'],
          ['owner-render', 'TwitCasting/Kick owner'],
          ['prepend-order', '新着が上、最古が下から削除'],
          ['failure-continuity', 'API失敗後もコメント追加可能'],
          ['ordinary-cleanup', '通常pagehideでGET停止・unsubscribe済み'],
          ['stop-exception', 'stop例外時もunsubscribe済み'],
          ['unsubscribe-exception', 'unsubscribe例外時もGET停止'],
        ]
        const results = document.getElementById('settings-check-results')
        const waitForSettingsTick = () => new Promise((resolve) => setTimeout(resolve, 600))
        const cssVariable = (name) => getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim()
        const resetSettingsResults = () => {
          results.replaceChildren(...settingsChecks.map(([key, label]) => {
            const item = document.createElement('li')
            item.dataset.check = key
            item.dataset.status = 'pending'
            item.textContent = `${label}: 未実行`
            return item
          }))
        }
        const recordSettingsResult = (key, pass, detail = '') => {
          const item = results.querySelector(`[data-check="${key}"]`)
          if (!item) return
          item.dataset.status = pass ? 'pass' : 'fail'
          item.textContent = `${settingsChecks.find(([nextKey]) => nextKey === key)[1]}: ${pass ? 'PASS' : 'FAIL'}${detail ? ` (${detail})` : ''}`
        }
        const check = (key, pass, detail = '') => {
          recordSettingsResult(key, Boolean(pass), detail)
          if (!pass) throw new Error(`${key}: ${detail || 'assertion failed'}`)
        }
        const updateFixtureSettings = async (patch) => {
          const api = window.__fixtureSettingsApi
          api.fail = false
          api.set({ ...api.settings, ...patch })
          await waitForSettingsTick()
        }
        const inlineColors = (element) => ({
          backgroundColor: element.style.backgroundColor,
          color: element.style.color,
        })
        const computedColors = (element) => {
          const style = getComputedStyle(element)
          return {
            backgroundColor: style.backgroundColor,
            color: style.color,
          }
        }
        const runCleanupScenario = (scenario) => new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            window.removeEventListener('message', onMessage)
            iframe.remove()
            reject(new Error(`${scenario} cleanup fixture timed out`))
          }, 4000)
          const onMessage = (event) => {
            if (
              event.origin !== window.location.origin ||
              !event.data ||
              event.data.fixtureCleanupScenario !== scenario
            ) return
            clearTimeout(timeout)
            window.removeEventListener('message', onMessage)
            iframe.remove()
            resolve(event.data)
          }
          window.addEventListener('message', onMessage)
          const iframe = document.createElement('iframe')
          iframe.hidden = true
          const url = new URL(window.location.href)
          url.search = `?fixtureCleanup=${encodeURIComponent(scenario)}`
          iframe.src = url.href
          document.body.append(iframe)
        })
        const runSettingsChecks = async () => {
          resetSettingsResults()
          document.documentElement.dataset.settingsChecksPass = 'running'
          const button = document.getElementById('run-settings-checks')
          button.disabled = true

          try {
            const api = window.__fixtureSettingsApi
            api.fail = false
            api.set({ theme: 'light', commentFontSize: 32, firstCommentFontSize: 64 })
            await waitForSettingsTick()
            check(
              'initial',
              cssVariable('--panel-background') === '#ffffff' &&
                cssVariable('--comment-font-size') === '32px' &&
                cssVariable('--first-comment-font-size') === '64px',
              `${cssVariable('--panel-background')} / ${cssVariable('--comment-font-size')} / ${cssVariable('--first-comment-font-size')}`,
            )

            await updateFixtureSettings({ theme: 'dark' })
            check(
              'dark',
              cssVariable('--panel-background') === '#0b0b0b' &&
                cssVariable('--comment-text-color') === '#ffffff' &&
                cssVariable('--comment-border-color') === '#333333',
              `${cssVariable('--panel-background')} / ${cssVariable('--comment-text-color')} / ${cssVariable('--comment-border-color')}`,
            )

            await updateFixtureSettings({ commentFontSize: 40 })
            check('normal-size', cssVariable('--comment-font-size') === '40px', cssVariable('--comment-font-size'))
            await updateFixtureSettings({ firstCommentFontSize: 80 })
            check('big-size', cssVariable('--first-comment-font-size') === '80px', cssVariable('--first-comment-font-size'))

            const setPropertyCount = window.__fixtureSettingsMetrics.setPropertyCount
            await updateFixtureSettings({})
            check(
              'same-settings',
              window.__fixtureSettingsMetrics.setPropertyCount === setPropertyCount,
              `${setPropertyCount} -> ${window.__fixtureSettingsMetrics.setPropertyCount}`,
            )

            await updateFixtureSettings({ theme: 'light', commentFontSize: 32, firstCommentFontSize: 64 })
            const container = document.getElementById('comments')
            container.replaceChildren()
            window.OneSDK.emitComments([
              ...Array.from({ length: 98 }, (_, index) => normal(`サイズ変更fit ${index + 1}`, false)),
              normal('BIG', true),
              normal(`サイズ変更fit 長文保持 ${'折り返し確認'.repeat(4)}`, false),
            ])
            const beforeFitCount = container.childElementCount
            const oldestBeforeSizeChange = container.lastElementChild.textContent
            const emitCountBeforeSizeChange = window.__fixtureState.emitCommentsCallCount
            await updateFixtureSettings({ commentFontSize: 40, firstCommentFontSize: 80 })
            const afterFitCount = container.childElementCount
            const retainedAfterSizeChange = Array.from(container.children)
            const sizeRefitPass =
              beforeFitCount > 2 &&
              afterFitCount < beforeFitCount &&
              !retainedAfterSizeChange.some((element) => element.textContent === oldestBeforeSizeChange) &&
              retainedAfterSizeChange.some((element) => element.classList.contains('comment--first')) &&
              retainedAfterSizeChange.some((element) => element.textContent.includes('長文保持')) &&
              container.scrollHeight <= container.clientHeight &&
              Number.isInteger(emitCountBeforeSizeChange) &&
              window.__fixtureState.emitCommentsCallCount === emitCountBeforeSizeChange
            check(
              'size-refit',
              sizeRefitPass,
              `${beforeFitCount} -> ${afterFitCount}; BIG=${retainedAfterSizeChange.some((element) => element.classList.contains('comment--first'))}; long=${retainedAfterSizeChange.some((element) => element.textContent.includes('長文保持'))}; oldestRemoved=${!retainedAfterSizeChange.some((element) => element.textContent === oldestBeforeSizeChange)}; fit=${container.scrollHeight}/${container.clientHeight}; emits=${emitCountBeforeSizeChange}/${window.__fixtureState.emitCommentsCallCount}`,
            )

            container.replaceChildren()
            emit(gift({
              itemName: '設定色Twicas',
              speechText: '設定色Twicas 設定色Twicas',
              isFreeGift: false,
              price: 100,
              backgroundColor: '#e2b52b',
              textColor: '#ffffff',
            }))
            const twicasGiftElement = container.querySelector('.comment--gift')
            emit(gift({
              itemName: 'neutral Twicas',
              speechText: 'neutral Twicas neutral Twicas',
              isFreeGift: true,
              price: 0,
              backgroundColor: '#e2b52b',
              textColor: '#ffffff',
            }))
            const neutralGiftElement = container.querySelector('.comment--gift')
            const neutralLightColors = computedColors(neutralGiftElement)
            emit(kickGift({
              amount: 100,
              backgroundColor: '#18fbb0',
              textColor: '#333333',
              includeAnimated: false,
              giftId: 'full_send',
              giftName: 'Full Send',
              type: 'BASIC',
              tier: 'BASIC',
              characterLimit: 0,
              pinnedTime: 0,
            }))
            emit(kickGift({ amount: 1000, backgroundColor: '#18e9fb' }))
            const kickGiftElements = Array.from(container.querySelectorAll('.comment--kick-gift'))
            const twicasColors = inlineColors(twicasGiftElement)
            const kickGiftForAmount = (amountText) => kickGiftElements.find(
              (element) => element.querySelector('.kick-gift__amount')?.textContent === amountText,
            )
            const basicKickGiftElement = kickGiftForAmount('(100)')
            const levelUpKickGiftElement = kickGiftForAmount('(1000)')
            const kickColorsByIdentity = {
              BASIC_100: basicKickGiftElement ? inlineColors(basicKickGiftElement) : null,
              LEVEL_UP_1000: levelUpKickGiftElement ? inlineColors(levelUpKickGiftElement) : null,
            }
            const expectedTwicasColors = {
              backgroundColor: 'rgb(226, 181, 43)',
              color: 'rgb(255, 255, 255)',
            }
            const expectedKickColorsByIdentity = {
              BASIC_100: {
                backgroundColor: 'rgb(24, 251, 176)',
                color: 'rgb(51, 51, 51)',
              },
              LEVEL_UP_1000: {
                backgroundColor: 'rgb(24, 233, 251)',
                color: 'rgb(51, 51, 51)',
              },
            }
            await updateFixtureSettings({ theme: 'dark' })
            const neutralDarkColors = computedColors(neutralGiftElement)
            const neutralGiftThemePass =
              JSON.stringify(neutralLightColors) === JSON.stringify({
                backgroundColor: 'rgb(255, 255, 255)',
                color: 'rgb(0, 0, 0)',
              }) &&
              JSON.stringify(neutralDarkColors) === JSON.stringify({
                backgroundColor: 'rgb(34, 34, 34)',
                color: 'rgb(255, 255, 255)',
              })
            const twicasGiftColorsPass =
              JSON.stringify(twicasColors) === JSON.stringify(expectedTwicasColors) &&
              JSON.stringify(inlineColors(twicasGiftElement)) === JSON.stringify(expectedTwicasColors)
            const kickColorsAfterThemeByIdentity = {
              BASIC_100: basicKickGiftElement ? inlineColors(basicKickGiftElement) : null,
              LEVEL_UP_1000: levelUpKickGiftElement ? inlineColors(levelUpKickGiftElement) : null,
            }
            const kickGiftColorsPass =
              kickGiftElements.length === 2 &&
              JSON.stringify(kickColorsByIdentity) === JSON.stringify(expectedKickColorsByIdentity) &&
              JSON.stringify(kickColorsAfterThemeByIdentity) === JSON.stringify(expectedKickColorsByIdentity)
            recordSettingsResult(
              'neutral-gift-theme',
              neutralGiftThemePass,
              `${JSON.stringify(neutralLightColors)} -> ${JSON.stringify(neutralDarkColors)}`,
            )
            recordSettingsResult(
              'twicas-gift-colors',
              twicasGiftColorsPass,
              JSON.stringify(twicasColors),
            )
            recordSettingsResult(
              'kick-gift-colors',
              kickGiftColorsPass,
              JSON.stringify(kickColorsByIdentity),
            )
            if (!neutralGiftThemePass || !twicasGiftColorsPass || !kickGiftColorsPass) {
              throw new Error('gift-colors: neutral theme or explicit inline color persistence failed')
            }

            container.replaceChildren()
            emit(normal('設定回帰 通常コメント', false))
            check('normal-render', container.firstElementChild.textContent === '設定回帰 通常コメント' && !container.firstElementChild.classList.contains('comment--first'))
            emit(normal('設定回帰 初コメBIG', true))
            check('first-render', container.firstElementChild.classList.contains('comment--first') && getComputedStyle(container.firstElementChild).fontSize === '80px')
            document.getElementById('emit-kick-emote').click()
            check('kick-emote-render', Boolean(container.firstElementChild.querySelector('.kick-emote')))
            document.getElementById('emit-twicas-owner-first').click()
            const twicasOwnerElement = container.firstElementChild
            document.getElementById('emit-kick-owner-emote').click()
            check(
              'owner-render',
              twicasOwnerElement.classList.contains('comment--owner') &&
                container.firstElementChild.classList.contains('comment--owner'),
            )

            container.replaceChildren()
            window.OneSDK.emitComments(Array.from({ length: 105 }, (_, index) => normal(`順序${index + 1}`, false)))
            check(
              'prepend-order',
              container.firstElementChild.textContent === '順序105' &&
                container.lastElementChild.textContent !== '順序1' &&
                container.childElementCount < 105,
              `${container.firstElementChild.textContent} / ${container.lastElementChild.textContent} / ${container.childElementCount}`,
            )

            await updateFixtureSettings({ theme: 'dark', commentFontSize: 40, firstCommentFontSize: 80 })
            api.fail = true
            await waitForSettingsTick()
            const defaultedAfterFailure =
              cssVariable('--panel-background') === '#ffffff' &&
              cssVariable('--comment-font-size') === '32px' &&
              cssVariable('--first-comment-font-size') === '64px'
            emit(normal('API失敗後の通常コメント', false))
            check(
              'failure-continuity',
              defaultedAfterFailure && container.firstElementChild.textContent === 'API失敗後の通常コメント',
              `${cssVariable('--panel-background')} / ${cssVariable('--comment-font-size')} / ${cssVariable('--first-comment-font-size')}`,
            )
            api.fail = false

            const ordinaryCleanup = await runCleanupScenario('ordinary-cleanup')
            check('ordinary-cleanup', ordinaryCleanup.pass, ordinaryCleanup.detail)
            const stopException = await runCleanupScenario('stop-exception')
            check('stop-exception', stopException.pass, stopException.detail)
            const unsubscribeException = await runCleanupScenario('unsubscribe-exception')
            check('unsubscribe-exception', unsubscribeException.pass, unsubscribeException.detail)

            document.documentElement.dataset.settingsChecksPass = 'true'
          } catch (error) {
            document.documentElement.dataset.settingsChecksPass = 'false'
            const firstPending = results.querySelector('[data-status="pending"]')
            if (firstPending) {
              firstPending.dataset.status = 'fail'
              firstPending.textContent = `${firstPending.textContent.replace(': 未実行', '')}: FAIL (${error.message})`
            }
            console.error('[fixture] 設定fixture検証に失敗しました。', error)
          } finally {
            button.disabled = false
          }
        }

        resetSettingsResults()
        document.getElementById('settings-light').addEventListener('click', () => updateFixtureSettings({ theme: 'light' }))
        document.getElementById('settings-dark').addEventListener('click', () => updateFixtureSettings({ theme: 'dark' }))
        document.getElementById('settings-normal-40').addEventListener('click', () => updateFixtureSettings({ commentFontSize: 40 }))
        document.getElementById('settings-big-80').addEventListener('click', () => updateFixtureSettings({ firstCommentFontSize: 80 }))
        document.getElementById('settings-same').addEventListener('click', async () => {
          const before = window.__fixtureSettingsMetrics.setPropertyCount
          await updateFixtureSettings({})
          recordSettingsResult('same-settings', before === window.__fixtureSettingsMetrics.setPropertyCount, `${before} -> ${window.__fixtureSettingsMetrics.setPropertyCount}`)
        })
        document.getElementById('settings-fail').addEventListener('click', async () => {
          window.__fixtureSettingsApi.fail = true
          await waitForSettingsTick()
        })
        document.getElementById('run-settings-checks').addEventListener('click', runSettingsChecks)

        const cleanupScenario = new URLSearchParams(window.location.search).get('fixtureCleanup')
        if (cleanupScenario) {
          ;(async () => {
            await waitForSettingsTick()
            const api = window.__fixtureSettingsApi
            if (cleanupScenario === 'stop-exception') api.throwAfterStop = true
            if (cleanupScenario === 'unsubscribe-exception') window.__fixtureState.throwOnUnsubscribe = true
            const subscriberReadyBeforeDispose =
              window.__fixtureState.subscriberId === 'fixture-subscriber'
            const getCountBeforeDispose = api.getCount
            window.dispatchEvent(new Event('pagehide'))
            const getCountAfterDispose = api.getCount
            await waitForSettingsTick()
            const cleanupCommonPass =
              subscriberReadyBeforeDispose &&
              getCountBeforeDispose > 0 &&
              api.stopCallCount === 1 &&
              api.getCount === getCountAfterDispose
            let pass = false
            if (cleanupScenario === 'ordinary-cleanup') {
              pass = cleanupCommonPass &&
                window.__fixtureState.unsubscribeCallCount === 1 &&
                window.__fixtureState.unsubscribedId === 'fixture-subscriber' &&
                window.__fixtureState.throwOnUnsubscribe === false &&
                api.throwAfterStop === false
            } else if (cleanupScenario === 'stop-exception') {
              pass = cleanupCommonPass &&
                window.__fixtureState.unsubscribeCallCount === 1 &&
                window.__fixtureState.unsubscribedId === 'fixture-subscriber'
            } else if (cleanupScenario === 'unsubscribe-exception') {
              pass = cleanupCommonPass &&
                window.__fixtureState.unsubscribeCallCount === 1 &&
                window.__fixtureState.unsubscribeThrowCount === 1 &&
                window.__fixtureState.unsubscribedId === 'fixture-subscriber'
            }
            window.parent.postMessage({
              fixtureCleanupScenario: cleanupScenario,
              pass,
              detail: `ready=${subscriberReadyBeforeDispose}; GET=${getCountBeforeDispose}/${getCountAfterDispose}/${api.getCount}; stop=${api.stopCallCount}; unsubscribe=${window.__fixtureState.unsubscribeCallCount}; id=${window.__fixtureState.unsubscribedId}; threw=${window.__fixtureState.unsubscribeThrowCount || 0}`,
            }, window.location.origin)
          })()
        }
        document.getElementById('dispose').addEventListener('click', () => window.dispatchEvent(new Event('pagehide')))
      })()
    </script>
  </body>
</html>
